[project]
name = "hyqs-ai"
version = "0.1.0"
description = "Hyqs — a living 24/7 personal AI orchestration agent (Claude Agent SDK)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    "psycopg[binary,pool]>=3.2",
    "jsonschema>=4.21",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "fastmcp>=3.4.2",
    "structlog>=24.1",
    "cryptography>=42",
    "maxminddb>=3.1.1",
]

[project.scripts]
hyqs = "hyqs.__main__:main"
hyqs-pipeline = "hyqs.pipeline.__main__:main"
hyqs-web = "hyqs.web.__main__:main"
hyqs-migrate-sqlite = "hyqs.pipeline.migrate_sqlite:main"
hyqs-jobs = "hyqs.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyqs"]
artifacts = ["hyqs/pipeline/schemas/*.schema.json"]

[dependency-groups]
dev = [
    "pytest>=8",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "semgrep>=1.70",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# Starlette 1.x TestClient emits StarletteDeprecationWarning when httpx is used
# instead of httpx2. httpx2 is an unverified third-party package (supply-chain
# risk); we suppress the warning here rather than install it.
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501 (line-too-long) is noisy and largely redundant with `ruff format`, which
# already wraps what it can; the residue is long strings/URLs/comments not worth
# churning. Ignore it rather than enforce line length as a merge-blocking gate.
ignore = ["E501", "E731"]
